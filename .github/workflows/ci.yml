name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Type check
        run: npm run check

      # RT-1 (#419): frontend unit tests are a required CI gate.
      - name: Unit tests (vitest)
        run: npm run test

  # RT-1 (#419): the full Rust test suite previously ran only on Linux;
  # image math and Tauri-adjacent code differ per platform, so the core
  # crate's tests + clippy now run on all three target OSes.
  rust-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-matrix-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (astroforge-core)
        run: cargo clippy -p astroforge-core --all-targets -- -D warnings

      - name: Test (astroforge-core)
        run: cargo test -p astroforge-core

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # RT-8 (#427) — execution-provider registration on real Metal
  # hardware. macOS runners need no GPU SDK for the CoreML feature
  # (ort's download-binaries artifact includes it), so this job runs
  # the astroforge-ai suite with the provider compiled in; every
  # open_catalog session registers CoreML before falling back.
  ai-gpu-coreml:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-gpu-coreml-${{ hashFiles('**/Cargo.lock') }}

      - name: Test (astroforge-ai, gpu-coreml)
        run: cargo test -p astroforge-ai --features gpu-coreml

      - name: Clippy (astroforge-ai, gpu-coreml)
        run: cargo clippy -p astroforge-ai --features gpu-coreml --all-targets -- -D warnings

  # Phase 7 close-out (#43 Windows, #44 macOS, #45 30-frame memory).
  # The CLI smoke + memory tests run as a matrix across the three target
  # OSes. The script is portable bash; Windows runners use Git Bash which
  # ships the same GNU coreutils, so the same `bash scripts/mvp_smoke.sh`
  # invocation works on all three.
  smoke:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --bin astroforge

      - name: Run smoke script
        shell: bash
        run: bash scripts/mvp_smoke.sh tests/fixtures/sample-session

  # 30-frame memory test (#45). Linux only — the RSS check reads
  # /proc/self/status. The smoke matrix above already exercises the
  # CLI on Windows and macOS; the dedicated memory job just guarantees
  # the Linux path stays under the 4 GB budget.
  memory:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mem-${{ hashFiles('**/Cargo.lock') }}

      - name: Run 30-frame memory test
        run: cargo test -p astroforge-app --test cli_memory -- --nocapture
