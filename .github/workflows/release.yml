name: Release

# RT-2 (#420): build signed-ready installers for the three target platforms
# on tag push. Produces a draft GitHub Release with the artifacts attached.
# Spec carrier: Phase 3 M3 (packaging) in docs/PROJECT_PLAN.md.
#
# Notes:
# - macOS artifacts are NOT code-signed/notarized (no signing identity is
#   configured yet). Gatekeeper will require a right-click → Open on first
#   launch. Signing setup is a follow-up once an Apple Developer identity
#   exists (see docs/ROADMAP_RECON_2026-10.md W2).
# - The license close-out (RT-3 / #421) should land before the first
#   non-rc public release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust-target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust-target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust-target: ""
          - platform: "windows-latest"
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AstroForge ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer for your platform. See [CHANGELOG.md](https://github.com/emmanuel-a-otchere/AstroForge/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
