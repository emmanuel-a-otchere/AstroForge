[package]
name = "astroforge-render"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
astroforge-core = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
# Version must match the one eframe's wgpu renderer pulls in (see
# Cargo.lock; both resolve to wgpu 30).
wgpu = { workspace = true }
# f32 -> f16 conversion for rgba16float texture uploads.
half = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Valid TIFF encoding for decoder tests. NOTE: astroforge-core's own
# export_tiff_16bit currently emits an invalid BitsPerSample IFD entry
# for RGB (inline value instead of an offset array), so core exports
# can't be roundtripped through from_tiff_bytes — flagged separately.
tiff = "0.11"
