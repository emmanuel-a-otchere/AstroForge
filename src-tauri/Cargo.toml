[package]
name = "astroforge-tauri"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
astroforge-core = { path = "../crates/astroforge-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
